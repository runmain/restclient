<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="HTTPyac Client for Zed">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="55%" stop-color="#134E4A"/>
      <stop offset="100%" stop-color="#042F2E"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="50%" stop-color="#2DD4BF"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#A78BFA" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Disc -->
  <circle cx="200" cy="200" r="200" fill="url(#bg)"/>

  <!-- Soft accent ring -->
  <circle cx="200" cy="200" r="152" fill="none" stroke="url(#ring)" stroke-width="10"/>
  <circle cx="200" cy="200" r="138" fill="none" stroke="#2DD4BF" stroke-width="1.5" opacity="0.35"/>

  <!-- Background monospaced hints -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-weight="700" opacity="0.22">
    <text x="118" y="118" font-size="18" fill="#5EEAD4">GET</text>
    <text x="268" y="128" font-size="16" fill="#A78BFA">200</text>
    <text x="92" y="292" font-size="16" fill="#F472B6">POST</text>
    <text x="270" y="286" font-size="15" fill="#FBBF24">{{env}}</text>
  </g>

  <!-- Variable braces {{  }} -->
  <g fill="none" stroke="#67E8F9" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" filter="url(#glow)">
    <!-- {{ -->
    <path d="M118 145 C100 155 96 170 96 200 C96 230 100 245 118 255"/>
    <path d="M138 145 C120 155 116 170 116 200 C116 230 120 245 138 255"/>
    <!-- }} -->
    <path d="M282 145 C300 155 304 170 304 200 C304 230 300 245 282 255"/>
    <path d="M262 145 C280 155 284 170 284 200 C284 230 280 245 262 255"/>
  </g>

  <!-- Play / send triangle (Zed action) -->
  <path d="M168 148 L168 252 L268 200 Z" fill="url(#bolt)" filter="url(#glow)"/>
  <path d="M176 162 L176 238 L248 200 Z" fill="#CCFBF1" opacity="0.35"/>

  <!-- Small HTTP bar under play -->
  <rect x="155" y="268" width="90" height="8" rx="4" fill="#2DD4BF" opacity="0.55"/>
  <text x="200" y="302" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="18" font-weight="700" fill="#E2E8F0" letter-spacing="1.5">HTTPyac</text>
  <text x="200" y="322" text-anchor="middle"
        font-family="ui-sans-serif, system-ui, sans-serif"
        font-size="11" font-weight="600" fill="#94A3B8" letter-spacing="2">FOR ZED</text>
</svg>
